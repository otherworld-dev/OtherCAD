name: runPythonTests
description: "Run Python tests, generate log and report"

inputs:
  testDescription:
    description: "Test description text, will be used on report"
    required: true
  testCommand:
    description: "Test command to be run"
    required: true
  logFile:
    description: "Path for log file"
    required: true
  reportFile:
    description: "Path for report file"
    required: true
  shellCmd:
    description: "Shell command to use for action steps (e.g. 'pixi run bash -l {0}')"
    default: "bash -l {0}"
    required: false

runs:
  using: "composite"
  steps:
    - name: Run tests
      id: runTests
      shell: ${{ inputs.shellCmd }}
      run: |
        set -o pipefail
        mkdir -p "$(dirname "${{ inputs.logFile }}")"
        {
          ${{ inputs.testCommand }}
        } 2>&1 | sed -Ee "/[[:blank:]]*\\([[:digit:]]{1,3} %\\)[[:blank:]]*/d" | tee -a "${{ inputs.logFile }}"
    - name: Write report
      shell: ${{ inputs.shellCmd }}
      if: always()
      run: |
        # Single-quoted so a Windows path keeps its backslashes, and quoted at every use
        logFile='${{ inputs.logFile }}'
        reportFile='${{ inputs.reportFile }}'
        mkdir -p "$(dirname "$logFile")"
        touch "$logFile"
        sed -ne "/^\(FAILED\|ERROR\):/,/^[[:blank:]]*$/bF; /^Traceback/,/^[^[:blank:]]/{/^Traceback/bT; /^[^[:blank:]]/G; bT}; b; :T w ${logFile}_tracebacks" -e "b; :F w ${logFile}_failedtests" "$logFile"
        icon=""
        if [ $( cat "${logFile}_tracebacks" | wc -l ) -gt 0 ]
        then
          icon=" :fire:"
        fi
        if [ ${{ steps.runTests.outcome }} == 'success' ]
        then
          echo "<details><summary>:heavy_check_mark: ${{ inputs.testDescription }} succeeded$icon</summary>" >> "$reportFile"
        else
          echo "<details><summary>:fire: ${{ inputs.testDescription }} failed$icon</summary>" >> "$reportFile"
          echo "" >> "$reportFile"
          echo "Failed tests" >> "$reportFile"
          echo "" >> "$reportFile"
          echo '```' >> "$reportFile"
          cat "${logFile}_failedtests" >> "$reportFile"
          echo '```' >> "$reportFile"
        fi
        echo "" >> "$reportFile"
        if [ $( cat "${logFile}_tracebacks" | wc -l ) -gt 0 ]
        then
          echo "Uncaught tracebacks -- these tracebacks appeared during test but didn't fail a test --" >> "$reportFile"
          echo "" >> "$reportFile"
          echo '```' >> "$reportFile"
          cat "${logFile}_tracebacks" >> "$reportFile"
          echo '```' >> "$reportFile"
        fi
        echo "</details>">> "$reportFile"
        echo "" >> "$reportFile"
