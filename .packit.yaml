specfile_path: package/fedora/othercad.spec
files_to_sync:
    - .packit.yaml
actions:
  post-upstream-clone:
    - bash -c '/usr/bin/python3 package/scripts/write_version_info.py othercad_version.txt'
    - rm -f othercad-sources.tar.gz
  changelog-entry:
    - bash -c 'git log --no-merges --pretty="format:- %s (%an)" $(git describe --tags --abbrev=0 )..HEAD -- |sed 's/%/%%/g''
  create-archive:
    - git submodule update --init
    - bash -c 'git ls-files --recurse-submodules | tar  -caf othercad-sources.tar.gz -T-'
    - echo -n 'othercad-sources.tar.gz'
downstream_package_name: othercad
upstream_tag_exclude: '.*'
notifications:
  pull_request:
    successful_build: false
additional_packages:
    - python3

jobs:
- job: copr_build
  identifier: pull_request
  trigger: pull_request
  branch: main
  manual_trigger: true
  targets:
    fedora-latest-stable:
      without_opts:
      - debug_info

- job: tests
  identifier: pull_request
  trigger: pull_request
  branch: main
  manual_trigger: true
  targets:
    fedora-latest-stable:
      without_opts:
      - debug_info
  fmf_path: package/fedora/tests

- job: copr_build
  identifier: main
  trigger: commit
  manual_trigger: true
  branch: main
  owner: 'otherworld-dev'
  project: nightly
- job: tests
  identifier: main
  trigger: commit
  branch: main
  manual_trigger: true
  targets:
    fedora-latest-stable:
      without_opts:
      - debug_info
  fmf_path: package/fedora/tests
  owner: 'otherworld-dev'
  project: nightly

- job: copr_build
  identifier: release
  trigger: release
  owner: 'otherworld-dev'
  project: othercad
  targets:
    fedora-all:
      without_opts:
      - tests
